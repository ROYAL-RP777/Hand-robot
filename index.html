<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Controlled YouTube App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        /* კამერა მარცხენა ზედა კუთხეში */
        #webcam-container {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #06b6d4;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10000;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #virtual-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            background: rgba(6, 182, 212, 0.7);
            border: 3px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 99999;
            transition: background 0.1s, transform 0.1s;
        }
        #virtual-cursor.clicking {
            background: rgba(16, 185, 129, 0.9);
            transform: translate(-50%, -50%) scale(0.8);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <!-- ვირტუალური კურსორი -->
    <div id="virtual-cursor"></div>

    <!-- მთავარი კონტეინერი YouTube-ით -->
    <div class="max-w-2xl w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 text-center">
        <h1 class="text-3xl font-bold mb-2 text-cyan-400">იუთუბის ვიდეოს მართვა ჟესტებით</h1>
        <p class="text-slate-300 mb-6">მიიტანე კურსორი ღილაკებზე და გააკეთე Pinch (ცერის და საჩვენებლის შეხება) ვიდეოს სამართავად!</p>

        <!-- YouTube ვიდეო საიტის შიგნით (Iframe API-ით) -->
        <div class="mb-6 relative w-full overflow-hidden rounded-xl shadow-lg border border-slate-600" style="padding-top: 56.25%;">
            <iframe id="yt-player" class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/jfKfPfyJRdk?enablejsapi=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <!-- YouTube მართვის რეალური ღილაკები -->
        <div class="grid grid-cols-2 gap-4">
            <button id="play-btn" onclick="controlVideo('play')" class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold transition">▶ დაკვრა (Play)</button>
            <button id="pause-btn" onclick="controlVideo('pause')" class="bg-red-600 hover:bg-red-500 py-3 rounded-xl font-bold transition">⏸ შეჩერება (Pause)</button>
        </div>
    </div>

    <!-- კამერა მარცხენა ზედა კუთხეში -->
    <div id="webcam-container">
        <video id="input_video" autoplay playsinline></video>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player');
        }

        function controlVideo(action) {
            if (player) {
                if (action === 'play') {
                    player.playVideo();
                } else if (action === 'pause') {
                    player.pauseVideo();
                }
            }
        }

        const videoElement = document.getElementById('input_video');
        const cursor = document.getElementById('virtual-cursor');

        let lastClickTime = 0;

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const indexTip = landmarks[8]; // საჩვენებელი თითი
                const thumbTip = landmarks[4]; // ცერი

                const x = window.innerWidth - (indexTest = indexTip.x * window.innerWidth); // სარკე
                const realX = window.innerWidth - (indexTip.x * window.innerWidth);
                const y = indexTip.y * window.innerHeight;

                cursor.style.left = `${realX}px`;
                cursor.style.top = `${y}px`;

                // კლიკის ლოგიკა (Pinch)
                const distance = Math.hypot(
                    indexTip.x - thumbTip.x,
                    indexTip.y - thumbTip.y
                );

                const now = Date.now();
                if (distance < 0.05 && (now - lastClickTime > 600)) {
                    cursor.classList.add('clicking');
                    lastClickTime = now;

                    const element = document.elementFromPoint(realX, y);
                    if (element && typeof element.click === 'function') {
                        element.click();
                    }

                    setTimeout(() => {
                        cursor.classList.remove('clicking');
                    }, 200);
                }
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
